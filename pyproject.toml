[project]
name = "databricks-comex-lakehouse"
version = "0.1.0"
description = "Projeto Medallion Lakehouse no Databricks usando dados públicos de Comércio Exterior do MDIC (Comex Stat) — Trilha de certificação Databricks Certified Data Engineer Associate."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
